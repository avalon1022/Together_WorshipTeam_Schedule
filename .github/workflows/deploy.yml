# main 브랜치에 코드가 올라오면 시험을 돌리고, 통과하면 Firebase에 배포합니다.
# 필요한 설정: README의 "10. 자동 배포 (GitHub Actions)" 참고
name: 배포

on:
  push:
    branches: [main]
  workflow_dispatch: # Actions 탭에서 "Run workflow"로 직접 실행

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 서버 시험
        run: node test/run.js

      - name: 설정 값 확인
        env:
          PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
          HAS_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
        run: |
          if [ -z "$PROJECT" ]; then echo "::error::저장소 Variables에 FIREBASE_PROJECT_ID가 없어요."; exit 1; fi
          if [ "$HAS_KEY" != "true" ]; then echo "::error::저장소 Secrets에 FIREBASE_SERVICE_ACCOUNT가 없어요."; exit 1; fi

      - name: functions/.env 만들기
        env:
          KAKAO_REST_API_KEY: ${{ vars.KAKAO_REST_API_KEY }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          CALENDAR_ID: ${{ vars.CALENDAR_ID }}
          CALENDAR_ICAL_URL: ${{ secrets.CALENDAR_ICAL_URL }}
        run: |
          {
            echo "KAKAO_REST_API_KEY=$KAKAO_REST_API_KEY"
            echo "PUBLIC_URL=$PUBLIC_URL"
            echo "CALENDAR_ID=$CALENDAR_ID"
            echo "CALENDAR_ICAL_URL=$CALENDAR_ICAL_URL"
          } > functions/.env

      - name: 패키지 설치
        run: |
          npm install --prefix functions --no-audit --no-fund
          npm install -g firebase-tools --no-audit --no-fund

      - name: 구글 계정 인증
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Firebase 배포
        env:
          PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
        run: firebase deploy --project "$PROJECT" --non-interactive
